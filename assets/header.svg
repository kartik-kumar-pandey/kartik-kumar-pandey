<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Kartik Pandey, Full-Stack Developer, AI and Blockchain Builder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#5B7CF0"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" rx="18" fill="url(#bg)"/>

  <!-- soft floating shapes -->
  <circle cx="120" cy="60" r="70" fill="#ffffff" fill-opacity="0.07">
    <animate attributeName="cy" values="60;80;60" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="170" r="90" fill="#ffffff" fill-opacity="0.07">
    <animate attributeName="cy" values="170;145;170" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="40" r="34" fill="#F472B6" fill-opacity="0.35">
    <animate attributeName="cx" values="760;790;760" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- bottom wave -->
  <path d="M0 175 C 200 140, 350 210, 550 175 S 850 140, 1000 175 L1000 220 L0 220 Z" fill="url(#wave)"/>

  <!-- text -->
  <text x="500" y="104" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="1">
    Kartik Pandey
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="500" y="146" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#ffffff" fill-opacity="0.92" letter-spacing="0.5">
    Full-Stack Developer  |  AI &amp; Blockchain Builder
    <animate attributeName="opacity" from="0" to="0.92" dur="1.8s" fill="freeze"/>
  </text>
</svg>
